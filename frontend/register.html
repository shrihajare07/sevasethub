<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customer Registration – SevaSetuHub</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Poppins:wght@600;700&display=swap" rel="stylesheet">

  <!-- Bootstrap 5 & Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <!-- SevaSetuHub Design System -->
  <link rel="stylesheet" href="../assets/css/variables.css">
  <link rel="stylesheet" href="../assets/css/reset.css">
  <link rel="stylesheet" href="../assets/css/components.css">
  <link rel="stylesheet" href="../assets/css/responsive.css">

  <style>
    body {
      background: linear-gradient(135deg, #0f172a 0%, #134e4a 50%, #0c4a6e 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }
    .auth-card {
      max-width: 540px;
      width: 100%;
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.3);
      padding: 2.5rem;
    }
  </style>
</head>
<body>

<div class="auth-card">
  <div class="text-center mb-4">
    <a href="../index.html" class="text-decoration-none d-inline-flex align-items-center gap-2 mb-2">
      <i class="bi bi-shield-check text-primary fs-2"></i>
      <span class="fs-3 fw-bold text-dark">SevaSetuHub</span>
    </a>
    <h5 class="fw-bold text-dark mt-2">Create Customer Account</h5>
    <p class="text-muted small">Book verified AC, cleaning, plumbing & electrical experts</p>
  </div>

  <form id="form-register">
    <div class="row g-2 mb-3">
      <div class="col-6">
        <label class="form-label fw-semibold">First Name <span class="text-danger">*</span></label>
        <input type="text" class="form-control" id="reg-firstname" placeholder="John" required>
      </div>
      <div class="col-6">
        <label class="form-label fw-semibold">Last Name <span class="text-danger">*</span></label>
        <input type="text" class="form-control" id="reg-lastname" placeholder="Doe" required>
      </div>
    </div>

    <div class="row g-2 mb-3">
      <div class="col-6">
        <label class="form-label fw-semibold">Mobile Number <span class="text-danger">*</span></label>
        <input type="tel" class="form-control" id="reg-mobile" placeholder="9876543210" required pattern="[0-9]{10}">
      </div>
      <div class="col-6">
        <label class="form-label fw-semibold">Email Address <span class="text-danger">*</span></label>
        <input type="email" class="form-control" id="reg-email" placeholder="john@example.com" required>
      </div>
    </div>

    <div class="row g-2 mb-3">
      <div class="col-6">
        <label class="form-label fw-semibold">Password <span class="text-danger">*</span></label>
        <input type="password" class="form-control" id="reg-password" placeholder="Min 6 chars" required minlength="6">
      </div>
      <div class="col-6">
        <label class="form-label fw-semibold">Confirm Password <span class="text-danger">*</span></label>
        <input type="password" class="form-control" id="reg-confirm-password" placeholder="Confirm" required>
      </div>
    </div>

    <div class="mb-3">
      <label class="form-label fw-semibold">Address</label>
      <input type="text" class="form-control" id="reg-address" placeholder="Flat, Street, Landmark">
    </div>

    <div class="row g-2 mb-4">
      <div class="col-6">
        <label class="form-label fw-semibold">City</label>
        <input type="text" class="form-control" id="reg-city" value="Kolhapur">
      </div>
      <div class="col-6">
        <label class="form-label fw-semibold">Pincode</label>
        <input type="text" class="form-control" id="reg-pincode" placeholder="416001">
      </div>
    </div>

    <button type="submit" class="btn btn-primary w-100 py-2 fw-bold mb-3" id="btn-submit-reg">
      Create Account & Continue
    </button>

    <div class="text-center small text-muted">
      Already have an account? <a href="login.html" class="fw-semibold text-primary">Sign In</a>
    </div>
  </form>
</div>

<!-- Scripts -->
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../assets/js/api.js"></script>
<script src="../assets/js/auth.js"></script>

<script>
  $(document).ready(function() {
    $('#form-register').on('submit', async function(e) {
      e.preventDefault();

      const pass = $('#reg-password').val();
      const confirmPass = $('#reg-confirm-password').val();

      if (pass !== confirmPass) {
        alert('Passwords do not match. Please re-enter.');
        return;
      }

      const btn = $('#btn-submit-reg');
      btn.prop('disabled', true).html('<span class="spinner-border spinner-border-sm"></span> Creating Account...');

      try {
        const payload = {
          firstName: $('#reg-firstname').val().trim(),
          lastName: $('#reg-lastname').val().trim(),
          mobile: $('#reg-mobile').val().trim(),
          email: $('#reg-email').val().trim(),
          password: pass,
          address: $('#reg-address').val().trim(),
          city: $('#reg-city').val().trim(),
          pincode: $('#reg-pincode').val().trim()
        };

        const res = await api.register(payload);
        alert('Account created successfully! Welcome to SevaSetuHub.');
        AuthGuard.redirectByRole(res.user.role);
      } catch (err) {
        alert('Registration error: ' + err.message);
      } finally {
        btn.prop('disabled', false).text('Create Account & Continue');
      }
    });
  });
</script>

</body>
</html>
