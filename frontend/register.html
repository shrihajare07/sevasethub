<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account – SevaSetuHub</title>
  <meta name="description" content="Register for free on SevaSetuHub and book verified home service professionals.">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">

  <!-- Bootstrap 5 & Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <!-- SevaSetuHub Design System -->
  <link rel="stylesheet" href="../assets/css/variables.css">
  <link rel="stylesheet" href="../assets/css/reset.css">
  <link rel="stylesheet" href="../assets/css/components.css">
  <link rel="stylesheet" href="../assets/css/responsive.css">

  <style>
    body {
      background: linear-gradient(145deg, #0c1628 0%, #0e2a3a 40%, #0a1f3d 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.5rem;
      position: relative;
      overflow: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(8, 145, 178, 0.10) 0%, transparent 65%);
      top: -200px;
      right: -150px;
      pointer-events: none;
      animation: authBlob 9s ease-in-out infinite;
    }

    body::after {
      content: '';
      position: fixed;
      width: 450px;
      height: 450px;
      background: radial-gradient(circle, rgba(30, 64, 175, 0.08) 0%, transparent 65%);
      bottom: -120px;
      left: -80px;
      pointer-events: none;
      animation: authBlob 11s ease-in-out infinite reverse;
    }

    @keyframes authBlob {
      0%, 100% { transform: scale(1) translateY(0); }
      50% { transform: scale(1.12) translateY(-20px); }
    }

    .auth-card {
      max-width: 560px;
      width: 100%;
      background: rgba(255, 255, 255, 0.97);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: var(--radius-2xl);
      box-shadow: 0 32px 72px rgba(0, 0, 0, 0.40), 0 0 0 1px rgba(255,255,255,0.15);
      padding: 2.5rem;
      position: relative;
      z-index: 1;
      animation: cardIn 0.5s var(--easing-spring) both;
    }

    @keyframes cardIn {
      from { opacity: 0; transform: translateY(24px) scale(0.97); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    .auth-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: var(--gradient-brand-vivid);
      border-radius: var(--radius-2xl) var(--radius-2xl) 0 0;
    }

    .auth-brand {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.4rem;
      margin-bottom: 1.75rem;
      text-align: center;
    }

    .auth-brand-logo {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      text-decoration: none;
      font-family: var(--font-heading);
      font-weight: 800;
      font-size: 1.35rem;
      color: var(--text-primary);
      letter-spacing: -0.03em;
      transition: opacity var(--transition-fast);
    }

    .auth-brand-logo:hover { opacity: 0.85; }

    .auth-brand-logo-icon {
      width: 36px;
      height: 36px;
      background: var(--gradient-brand);
      border-radius: 9px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 1rem;
      box-shadow: var(--shadow-brand);
    }

    .auth-brand-name-seva { color: var(--primary); }
    .auth-brand-name-setu { color: var(--secondary); }

    .auth-tagline {
      font-size: var(--text-xs);
      color: var(--text-muted);
      letter-spacing: 0.04em;
      text-transform: uppercase;
      font-weight: 500;
    }

    .auth-title {
      font-size: var(--text-xl);
      font-weight: var(--weight-bold);
      color: var(--text-primary);
      margin-top: 0.35rem;
      letter-spacing: -0.02em;
    }

    .auth-subtitle {
      font-size: var(--text-sm);
      color: var(--text-muted);
      margin-top: 0.15rem;
    }

    /* Form field groups */
    .auth-field-group {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.75rem;
      margin-bottom: 0.85rem;
    }

    .auth-field-full {
      margin-bottom: 0.85rem;
    }

    .auth-label {
      font-size: var(--text-xs);
      font-weight: var(--weight-semibold);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-muted);
      margin-bottom: 0.35rem;
      display: block;
    }

    .auth-input {
      width: 100%;
      padding: 0.72rem 0.9rem;
      border: 1.5px solid var(--border);
      border-radius: var(--radius-md);
      font-size: var(--text-sm);
      font-family: var(--font-sans);
      color: var(--text-primary);
      background: var(--neutral-50);
      transition: all var(--transition-fast);
      outline: none;
    }

    .auth-input:focus {
      border-color: var(--primary);
      background: var(--surface);
      box-shadow: 0 0 0 4px rgba(8, 145, 178, 0.12);
    }

    .auth-input::placeholder {
      color: var(--text-disabled);
    }

    .field-required {
      color: var(--danger);
      margin-left: 2px;
    }

    /* Progress indicators */
    .reg-progress {
      display: flex;
      gap: 4px;
      justify-content: center;
      margin-bottom: 1.5rem;
    }

    .reg-progress-dot {
      width: 28px;
      height: 4px;
      border-radius: var(--radius-full);
      background: var(--border);
      transition: background var(--transition-base);
    }

    .reg-progress-dot.active {
      background: var(--gradient-brand);
    }

    .auth-submit-btn {
      width: 100%;
      padding: 0.9rem 1.5rem;
      background: var(--gradient-brand);
      color: #ffffff;
      font-size: var(--text-base);
      font-weight: var(--weight-bold);
      border: none;
      border-radius: var(--radius-md);
      cursor: pointer;
      transition: all var(--transition-base);
      box-shadow: var(--shadow-brand);
      letter-spacing: 0.01em;
      margin-top: 0.5rem;
      position: relative;
      overflow: hidden;
    }

    .auth-submit-btn:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-brand-lg);
      filter: brightness(1.05);
    }

    .auth-submit-btn:disabled {
      opacity: 0.7;
      cursor: not-allowed;
      transform: none;
    }

    .auth-switch {
      text-align: center;
      font-size: var(--text-sm);
      color: var(--text-muted);
      margin-top: 1.25rem;
    }

    .auth-switch a {
      color: var(--primary);
      font-weight: var(--weight-semibold);
      text-decoration: none;
    }

    .auth-switch a:hover { text-decoration: underline; }

    /* Trust badges under form */
    .auth-trust-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      margin-top: 1.25rem;
      padding-top: 1rem;
      border-top: 1px solid var(--border);
    }

    .auth-trust-item {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 0.72rem;
      color: var(--text-muted);
      font-weight: 500;
    }

    .auth-trust-item i {
      color: var(--success);
      font-size: 0.85rem;
    }

    @media (max-width: 480px) {
      .auth-field-group {
        grid-template-columns: 1fr;
      }
      .auth-card {
        padding: 1.75rem 1.25rem;
        border-radius: var(--radius-xl);
      }
    }
  </style>
</head>
<body>

<div class="auth-card">
  <!-- Brand -->
  <div class="auth-brand">
    <a href="../index.html" class="auth-brand-logo">
      <span class="auth-brand-logo-icon"><i class="bi bi-shield-check"></i></span>
      <span>
        <span class="auth-brand-name-seva">Seva</span><span class="auth-brand-name-setu">Setu</span>Hub
      </span>
    </a>
    <p class="auth-tagline">Connecting You to Trusted Services</p>
    <h1 class="auth-title">Create Your Account &#128640;</h1>
    <p class="auth-subtitle">Book AC, cleaning, plumbing &amp; electrical experts</p>
  </div>

  <form id="form-register" novalidate>
    <!-- Name Row -->
    <div class="auth-field-group">
      <div>
        <label class="auth-label" for="reg-firstname">First Name <span class="field-required">*</span></label>
        <input type="text" class="auth-input" id="reg-firstname" placeholder="John" required>
      </div>
      <div>
        <label class="auth-label" for="reg-lastname">Last Name <span class="field-required">*</span></label>
        <input type="text" class="auth-input" id="reg-lastname" placeholder="Doe" required>
      </div>
    </div>

    <!-- Contact Row -->
    <div class="auth-field-group">
      <div>
        <label class="auth-label" for="reg-mobile">Mobile <span class="field-required">*</span></label>
        <input type="tel" class="auth-input" id="reg-mobile" placeholder="9876543210" required pattern="[0-9]{10}">
      </div>
      <div>
        <label class="auth-label" for="reg-email">Email <span class="field-required">*</span></label>
        <input type="email" class="auth-input" id="reg-email" placeholder="john@example.com" required>
      </div>
    </div>

    <!-- Password Row -->
    <div class="auth-field-group">
      <div>
        <label class="auth-label" for="reg-password">Password <span class="field-required">*</span></label>
        <input type="password" class="auth-input" id="reg-password" placeholder="Min 6 characters" required minlength="6">
      </div>
      <div>
        <label class="auth-label" for="reg-confirm-password">Confirm Password <span class="field-required">*</span></label>
        <input type="password" class="auth-input" id="reg-confirm-password" placeholder="Re-enter password" required>
      </div>
    </div>

    <!-- Address -->
    <div class="auth-field-full">
      <label class="auth-label" for="reg-address">Address</label>
      <input type="text" class="auth-input" id="reg-address" placeholder="Flat no., Street, Landmark">
    </div>

    <!-- City & Pincode -->
    <div class="auth-field-group">
      <div>
        <label class="auth-label" for="reg-city">City</label>
        <input type="text" class="auth-input" id="reg-city" value="Kolhapur">
      </div>
      <div>
        <label class="auth-label" for="reg-pincode">Pincode</label>
        <input type="text" class="auth-input" id="reg-pincode" placeholder="416001">
      </div>
    </div>

    <button type="submit" class="auth-submit-btn" id="btn-submit-reg">
      Create Account &amp; Continue &rarr;
    </button>
  </form>

  <p class="auth-switch">
    Already have an account? <a href="login.html">Sign in</a>
  </p>

  <!-- Trust items -->
  <div class="auth-trust-row">
    <div class="auth-trust-item"><i class="bi bi-shield-lock-fill"></i> Secure &amp; Private</div>
    <div class="auth-trust-item"><i class="bi bi-patch-check-fill"></i> Verified Platform</div>
    <div class="auth-trust-item"><i class="bi bi-lock-fill"></i> No Spam</div>
  </div>
</div>

<!-- Scripts -->
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../assets/js/security.js"></script>
<script src="../assets/js/api.js"></script>
<script src="../assets/js/auth.js"></script>

<script>
  $(document).ready(function() {
    $('#form-register').on('submit', async function(e) {
      e.preventDefault();

      const pass = $('#reg-password').val();
      const confirmPass = $('#reg-confirm-password').val();

      if (pass !== confirmPass) {
        alert('Passwords do not match. Please re-enter.');
        return;
      }

      const btn = $('#btn-submit-reg');
      btn.prop('disabled', true).html('<span class="spinner-border spinner-border-sm me-2"></span>Creating Account...');

      try {
        const payload = {
          firstName: $('#reg-firstname').val().trim(),
          lastName: $('#reg-lastname').val().trim(),
          mobile: $('#reg-mobile').val().trim(),
          email: $('#reg-email').val().trim(),
          password: pass,
          address: $('#reg-address').val().trim(),
          city: $('#reg-city').val().trim(),
          pincode: $('#reg-pincode').val().trim()
        };

        const res = await api.register(payload);
        alert('Account created successfully! Welcome to SevaSetuHub.');
        AuthGuard.redirectByRole(res.user.role);
      } catch (err) {
        alert('Registration error: ' + err.message);
      } finally {
        btn.prop('disabled', false).html('Create Account &amp; Continue &rarr;');
      }
    });
  });
</script>

</body>
</html>
