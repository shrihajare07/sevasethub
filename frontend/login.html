<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login – SevaSetuHub</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Poppins:wght@600;700&display=swap" rel="stylesheet">

  <!-- Bootstrap 5 & Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <!-- SevaSetuHub Design System -->
  <link rel="stylesheet" href="../assets/css/variables.css">
  <link rel="stylesheet" href="../assets/css/reset.css">
  <link rel="stylesheet" href="../assets/css/components.css">
  <link rel="stylesheet" href="../assets/css/responsive.css">

  <style>
    body {
      background: linear-gradient(135deg, #0f172a 0%, #134e4a 50%, #0c4a6e 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }
    .auth-card {
      max-width: 460px;
      width: 100%;
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.3);
      padding: 2.5rem;
    }
    .demo-role-btn {
      font-size: 0.78rem;
      padding: 0.35rem 0.5rem;
    }
  </style>
</head>
<body>

<div class="auth-card">
  <div class="text-center mb-4">
    <a href="../index.html" class="text-decoration-none d-inline-flex align-items-center gap-2 mb-2">
      <i class="bi bi-shield-check text-primary fs-2"></i>
      <span class="fs-3 fw-bold text-dark">SevaSetuHub</span>
    </a>
    <p class="text-muted small">Connecting You to Trusted Services</p>
    <h5 class="fw-bold text-dark mt-3">Account Sign In</h5>
  </div>

  <!-- Quick Demo Role Switcher -->
  <div class="p-3 bg-light rounded-3 mb-4">
    <div class="d-flex justify-content-between align-items-center mb-2">
      <small class="fw-bold text-muted text-uppercase" style="font-size: 0.7rem;">Quick 1-Click Role Login</small>
      <span class="badge bg-success">Production Ready</span>
    </div>
    <div class="d-flex flex-wrap gap-1">
      <button type="button" class="btn btn-outline-secondary demo-role-btn" data-email="customer@sevasetuhub.in" data-pass="CustPassword@2026">
        <i class="bi bi-person-fill text-primary"></i> Customer
      </button>
      <button type="button" class="btn btn-outline-secondary demo-role-btn" data-email="tech@sevasetuhub.in" data-pass="TechPassword@2026">
        <i class="bi bi-tools text-warning"></i> Technician
      </button>
      <button type="button" class="btn btn-outline-secondary demo-role-btn" data-email="dispatch@sevasetuhub.in" data-pass="DispPassword@2026">
        <i class="bi bi-calendar3 text-info"></i> Dispatcher
      </button>
      <button type="button" class="btn btn-outline-secondary demo-role-btn" data-email="admin@sevasetuhub.in" data-pass="AdminPassword@2026">
        <i class="bi bi-shield-lock-fill text-danger"></i> SuperAdmin
      </button>
    </div>
  </div>

  <form id="form-login">
    <div class="mb-3">
      <label class="form-label fw-semibold">Email or Mobile Number</label>
      <div class="input-group">
        <span class="input-group-text bg-white"><i class="bi bi-person text-muted"></i></span>
        <input type="text" class="form-control" id="login-email" placeholder="e.g. customer@sevasetuhub.in" required>
      </div>
    </div>

    <div class="mb-3">
      <div class="d-flex justify-content-between">
        <label class="form-label fw-semibold">Password</label>
        <a href="#" class="small text-decoration-none" id="btn-forgot-password">Forgot?</a>
      </div>
      <div class="input-group">
        <span class="input-group-text bg-white"><i class="bi bi-key text-muted"></i></span>
        <input type="password" class="form-control" id="login-password" placeholder="••••••••" required>
      </div>
    </div>

    <button type="submit" class="btn btn-primary w-100 py-2 fw-bold mb-3" id="btn-submit-login">
      Sign In to Dashboard
    </button>

    <div class="text-center small text-muted">
      Don't have an account? <a href="register.html" class="fw-semibold text-primary">Register Free</a>
    </div>
  </form>
</div>

<!-- Scripts -->
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../assets/js/api.js"></script>
<script src="../assets/js/auth.js"></script>

<script>
  $(document).ready(function() {
    // Quick Demo Role Click Handler
    $('.demo-role-btn').on('click', function() {
      $('#login-email').val($(this).data('email'));
      $('#login-password').val($(this).data('pass'));
      $('#form-login').submit();
    });

    // Form Submit Handler
    $('#form-login').on('submit', async function(e) {
      e.preventDefault();
      const email = $('#login-email').val().trim();
      const password = $('#login-password').val();

      const btn = $('#btn-submit-login');
      btn.prop('disabled', true).html('<span class="spinner-border spinner-border-sm"></span> Verifying...');

      try {
        const res = await api.login(email, password);
        AuthGuard.redirectByRole(res.user.role);
      } catch (err) {
        alert('Login failed: ' + err.message);
      } finally {
        btn.prop('disabled', false).text('Sign In to Dashboard');
      }
    });

    $('#btn-forgot-password').on('click', function(e) {
      e.preventDefault();
      const email = prompt('Enter your registered Email or Mobile number:');
      if (email) {
        alert('Password reset instructions have been sent to your registered contact.');
      }
    });
  });
</script>

</body>
</html>
