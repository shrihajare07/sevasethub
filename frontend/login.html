<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In – SevaSetuHub</title>
  <meta name="description" content="Sign in to your SevaSetuHub account to manage bookings, invoices and AMC contracts.">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">

  <!-- Bootstrap 5 & Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <!-- SevaSetuHub Design System -->
  <link rel="stylesheet" href="../assets/css/variables.css">
  <link rel="stylesheet" href="../assets/css/reset.css">
  <link rel="stylesheet" href="../assets/css/components.css">
  <link rel="stylesheet" href="../assets/css/responsive.css">

  <style>
    /* --- Auth Page Shell --- */
    body {
      background: linear-gradient(145deg, #0c1628 0%, #0e2a3a 40%, #0a1f3d 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      position: relative;
      overflow: hidden;
    }

    /* Animated background blobs */
    body::before {
      content: '';
      position: fixed;
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(8, 145, 178, 0.10) 0%, transparent 65%);
      top: -200px;
      right: -150px;
      pointer-events: none;
      animation: authBlob 9s ease-in-out infinite;
    }

    body::after {
      content: '';
      position: fixed;
      width: 450px;
      height: 450px;
      background: radial-gradient(circle, rgba(30, 64, 175, 0.08) 0%, transparent 65%);
      bottom: -120px;
      left: -80px;
      pointer-events: none;
      animation: authBlob 11s ease-in-out infinite reverse;
    }

    @keyframes authBlob {
      0%, 100% { transform: scale(1) translateY(0); }
      50% { transform: scale(1.12) translateY(-20px); }
    }

    /* --- Auth Card --- */
    .auth-card {
      max-width: 460px;
      width: 100%;
      background: rgba(255, 255, 255, 0.97);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: var(--radius-2xl);
      box-shadow: 0 32px 72px rgba(0, 0, 0, 0.40), 0 0 0 1px rgba(255,255,255,0.15);
      padding: 2.75rem 2.5rem;
      position: relative;
      z-index: 1;
      animation: cardIn 0.5s var(--easing-spring) both;
    }

    @keyframes cardIn {
      from { opacity: 0; transform: translateY(24px) scale(0.97); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* Top gradient accent */
    .auth-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: var(--gradient-brand-vivid);
      border-radius: var(--radius-2xl) var(--radius-2xl) 0 0;
    }

    /* --- Brand Header --- */
    .auth-brand {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 1.75rem;
      text-align: center;
    }

    .auth-brand-logo {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      text-decoration: none;
      font-family: var(--font-heading);
      font-weight: 800;
      font-size: 1.4rem;
      color: var(--text-primary);
      letter-spacing: -0.03em;
      transition: opacity var(--transition-fast);
    }

    .auth-brand-logo:hover { opacity: 0.85; }

    .auth-brand-logo-icon {
      width: 38px;
      height: 38px;
      background: var(--gradient-brand);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 1.1rem;
      box-shadow: var(--shadow-brand);
    }

    .auth-brand-name-seva { color: var(--primary); }
    .auth-brand-name-setu { color: var(--secondary); }

    .auth-tagline {
      font-size: var(--text-xs);
      color: var(--text-muted);
      letter-spacing: 0.04em;
      text-transform: uppercase;
      font-weight: 500;
    }

    .auth-title {
      font-size: var(--text-xl);
      font-weight: var(--weight-bold);
      color: var(--text-primary);
      margin-top: 0.5rem;
      letter-spacing: -0.02em;
    }

    /* --- Demo Section --- */
    .demo-section {
      background: linear-gradient(135deg, var(--neutral-50) 0%, rgba(8,145,178,0.05) 100%);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 1rem;
      margin-bottom: 1.25rem;
    }

    .demo-section-label {
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-muted);
      margin-bottom: 0.6rem;
    }

    .demo-role-btn {
      font-size: 0.78rem;
      padding: 0.35rem 0.65rem;
      border-radius: var(--radius-sm);
      border: 1.5px solid var(--border);
      background: var(--surface);
      color: var(--text-secondary);
      font-weight: 600;
      cursor: pointer;
      transition: all var(--transition-fast);
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    .demo-role-btn:hover {
      border-color: var(--primary);
      background: var(--primary-muted);
      color: var(--primary-dark);
    }

    /* --- Form Inputs --- */
    .auth-form-group { margin-bottom: 1.1rem; }

    .auth-label {
      font-size: var(--text-xs);
      font-weight: var(--weight-semibold);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-muted);
      margin-bottom: 0.4rem;
      display: block;
    }

    .auth-input-wrap {
      position: relative;
      display: flex;
      align-items: center;
    }

    .auth-input-icon {
      position: absolute;
      left: 14px;
      color: var(--text-muted);
      font-size: 1rem;
      pointer-events: none;
      z-index: 2;
      transition: color var(--transition-fast);
    }

    .auth-input {
      width: 100%;
      padding: 0.8rem 0.9rem 0.8rem 2.6rem;
      border: 1.5px solid var(--border);
      border-radius: var(--radius-md);
      font-size: var(--text-base);
      font-family: var(--font-sans);
      color: var(--text-primary);
      background: var(--neutral-50);
      transition: all var(--transition-fast);
      outline: none;
    }

    .auth-input:focus {
      border-color: var(--primary);
      background: var(--surface);
      box-shadow: 0 0 0 4px rgba(8, 145, 178, 0.12);
    }

    .auth-input:focus + .auth-input-icon,
    .auth-input-wrap:focus-within .auth-input-icon {
      color: var(--primary);
    }

    .auth-forgot {
      font-size: var(--text-xs);
      font-weight: var(--weight-semibold);
      color: var(--primary);
      text-decoration: none;
    }

    .auth-forgot:hover { text-decoration: underline; }

    /* --- Submit Button --- */
    .auth-submit-btn {
      width: 100%;
      padding: 0.9rem 1.5rem;
      background: var(--gradient-brand);
      color: #ffffff;
      font-size: var(--text-base);
      font-weight: var(--weight-bold);
      border: none;
      border-radius: var(--radius-md);
      cursor: pointer;
      transition: all var(--transition-base);
      box-shadow: var(--shadow-brand);
      letter-spacing: 0.01em;
      position: relative;
      overflow: hidden;
    }

    .auth-submit-btn::after {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at center, rgba(255,255,255,0.25) 0%, transparent 70%);
      opacity: 0;
      transform: scale(0);
      transition: opacity 0.4s ease, transform 0.5s ease;
    }

    .auth-submit-btn:active::after {
      opacity: 1;
      transform: scale(2.5);
      transition: none;
    }

    .auth-submit-btn:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-brand-lg);
      filter: brightness(1.05);
    }

    .auth-submit-btn:disabled {
      opacity: 0.7;
      cursor: not-allowed;
      transform: none;
    }

    /* --- Footer Link --- */
    .auth-switch {
      text-align: center;
      font-size: var(--text-sm);
      color: var(--text-muted);
      margin-top: 1.25rem;
    }

    .auth-switch a {
      color: var(--primary);
      font-weight: var(--weight-semibold);
      text-decoration: none;
    }

    .auth-switch a:hover { text-decoration: underline; }

    /* --- Divider --- */
    .auth-divider {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin: 1.25rem 0;
      color: var(--text-muted);
      font-size: var(--text-xs);
    }

    .auth-divider::before,
    .auth-divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    /* --- Production badge --- */
    .prod-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: var(--success-light);
      color: var(--success);
      font-size: 0.68rem;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: var(--radius-full);
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }
  </style>
</head>
<body>

<div class="auth-card">
  <!-- Brand -->
  <div class="auth-brand">
    <a href="../index.html" class="auth-brand-logo">
      <span class="auth-brand-logo-icon"><i class="bi bi-shield-check"></i></span>
      <span>
        <span class="auth-brand-name-seva">Seva</span><span class="auth-brand-name-setu">Setu</span>Hub
      </span>
    </a>
    <p class="auth-tagline">Connecting You to Trusted Services</p>
    <h1 class="auth-title">Welcome Back &#128075;</h1>
  </div>

  <!-- Quick Admin Role Switcher (Hidden by default) -->
  <div id="quick-demo-section" class="demo-section d-none">
    <div class="d-flex justify-content-between align-items-center mb-2">
      <span class="demo-section-label">Admin Quick Fill</span>
      <span class="prod-badge"><i class="bi bi-check-circle-fill"></i> Ready</span>
    </div>
    <div class="d-flex flex-wrap gap-2">
      <button type="button" class="demo-role-btn" data-email="shri.hajare@gmail.com" data-pass="@dmin123">
        <i class="bi bi-shield-lock-fill" style="color:var(--danger)"></i> SuperAdmin
      </button>
    </div>
  </div>

  <form id="form-login" novalidate>
    <!-- Email/Mobile -->
    <div class="auth-form-group">
      <label class="auth-label" for="login-email">Email or Mobile Number</label>
      <div class="auth-input-wrap">
        <input type="text" class="auth-input" id="login-email" placeholder="e.g. shri.hajare@gmail.com or mobile" required autocomplete="username">
        <i class="bi bi-person auth-input-icon"></i>
      </div>
    </div>

    <!-- Password -->
    <div class="auth-form-group">
      <div class="d-flex justify-content-between align-items-center mb-1">
        <label class="auth-label mb-0" for="login-password">Password</label>
        <a href="#" class="auth-forgot" id="btn-forgot-password">Forgot password?</a>
      </div>
      <div class="auth-input-wrap">
        <input type="password" class="auth-input" id="login-password" placeholder="••••••••" required autocomplete="current-password">
        <i class="bi bi-lock auth-input-icon"></i>
      </div>
    </div>

    <button type="submit" class="auth-submit-btn mt-2" id="btn-submit-login">
      Sign In to Dashboard
    </button>
  </form>

  <p class="auth-switch">
    Don't have an account? <a href="register.html">Create one free</a>
  </p>
</div>

<!-- Scripts -->
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../assets/js/security.js"></script>
<script src="../assets/js/components.js"></script>
<script src="../assets/js/api.js"></script>
<script src="../assets/js/auth.js"></script>

<script>
  $(document).ready(function() {
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.has('demo')) {
      const demoParam = urlParams.get('demo');
      localStorage.setItem('show_demo_logins', demoParam === 'true' || demoParam === '1' ? 'true' : 'false');
    }

    const showDemoSetting = localStorage.getItem('show_demo_logins');
    const isDemoEnabled = showDemoSetting === 'true' || showDemoSetting === '1';
    if (isDemoEnabled) $('#quick-demo-section').removeClass('d-none');

    // Secret: triple-click brand logo to toggle demo
    let logoClicks = 0;
    $('.auth-brand-logo').on('click', function(e) {
      logoClicks++;
      if (logoClicks >= 3) {
        logoClicks = 0;
        const current = localStorage.getItem('show_demo_logins') === 'true';
        const next = !current;
        localStorage.setItem('show_demo_logins', next ? 'true' : 'false');
        $('#quick-demo-section').toggleClass('d-none', !next);
        alert(`Quick Demo Logins are now ${next ? 'VISIBLE' : 'HIDDEN'}.`);
      }
    });

    // Demo role click
    $('.demo-role-btn').on('click', function() {
      $('#login-email').val($(this).data('email'));
      $('#login-password').val($(this).data('pass'));
      $('#form-login').submit();
    });

    // Form submit with Liquid Loader
    $('#form-login').on('submit', async function(e) {
      e.preventDefault();
      const email = $('#login-email').val().trim();
      const password = $('#login-password').val();
      const btn = $('#btn-submit-login');
      btn.prop('disabled', true).html('<span class="spinner-border spinner-border-sm me-2"></span>Verifying...');

      if (window.SevaLoader) {
        SevaLoader.show({
          title: 'Authenticating Account',
          subtitle: 'Verifying your credentials and establishing a secure session...',
          statusText: 'Verifying Security Token',
          icon: 'bi-shield-lock-fill'
        });
      }

      try {
        const res = await api.login(email, password);
        if (window.SevaLoader) {
          SevaLoader.update({
            title: 'Welcome Back!',
            subtitle: `Signed in as ${res.user.fullName || res.user.firstName}. Redirecting to dashboard...`,
            statusText: 'Session Active',
            icon: 'bi-check-circle-fill'
          });
        }
        setTimeout(() => {
          AuthGuard.redirectByRole(res.user.role);
        }, 500);
      } catch (err) {
        if (window.SevaLoader) SevaLoader.hide();
        alert('Login failed: ' + err.message);
      } finally {
        btn.prop('disabled', false).text('Sign In to Dashboard');
      }
    });

    $('#btn-forgot-password').on('click', function(e) {
      e.preventDefault();
      const email = prompt('Enter your registered Email or Mobile number:');
      if (email) alert('Password reset instructions have been sent to your registered contact.');
    });
  });
</script>
</body>
</html>
